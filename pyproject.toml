[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myrag-pipeline"
version = "0.6.1"
description = "RAG data cleanup pipeline with multi-format parsers and bge-m3 embedding service."
requires-python = ">=3.10"
dependencies = [
    "markitdown[pdf]>=0.1",         # Universal doc conversion (PDF, DOCX, MD, TXT)
    "trafilatura>=1.12",            # HTML content extraction
    "httpx>=0.27",                  # HTTP client for LLM + embedding APIs
    "markdown-it-py>=3.0,<4",      # Markdown parser (header-aware chunking)
    "PyYAML>=6.0",                  # Config loader (conf/config.yaml, clean_rules.yaml)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.0",
    "types-PyYAML",
]
sqlite-vec = ["sqlite-vec>=0.1"]  # Local vector storage (lightweight, single-file)
local-embeddings = ["sentence-transformers>=2.7"]  # Local bge-m3 (CPU inference, ~1.1GB model)

[project.scripts]
myrag = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["myrag_pipeline.egg-info", "tests*"]

[tool.setuptools]
py-modules = ["pipeline", "config"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_comments = true
exclude = ["(?i)\\.git|(?i)\\.env|(?i)venv|(?i)node_modules|(?i)dist|(?i)build"]

[[tool.mypy.overrides]]
module = ["markitdown.*", "trafilatura.*", "sqlite_vec.*", "bge_m3.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "D", "DTZ", "EM", "FBT", "ICN", "ISC", "LOG", "PIE", "Q", "RSE", "RET", "SIM", "TCH", "TID", "TRY", "UP", "YTT"]
ignore = ["E501", "D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D103", "D104", "S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
