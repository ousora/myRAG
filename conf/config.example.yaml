# myRAG Configuration
# ===================
# Copy this file to config.yaml and fill in your actual endpoints.
# config.yaml is gitignored — safe for local IPs and secrets.
# This example file IS committed to git for documentation.

# ── LLM Service (formatters) ─────────────────────────────────────────
llm:
  # OpenAI-compatible chat completions endpoint
  endpoint: "http://localhost:8081/v1/chat/completions"
  model: "Qwen/QwQ-32B-A3B-Claude-4.7-Opus-Reasoning-Distilled-APEX-I-Compact.gguf"
  # Generation parameters
  temperature: 0.3
  max_tokens: 16384
  timeout: 300               # seconds for HTTP request

# ── Embedding Service (embedders) ────────────────────────────────────
embedding:
  mode: "remote"            # ← "remote" or "local" (one-click switch)

  # When mode == "remote":
  base_url: "http://localhost:11435"
  model: "bge-m3"
  timeout: 60                # seconds for HTTP request

  # Instruction prepended to *queries* (not documents) for retrieval-trained
  # models like bge-m3. Empty string disables it. Keep the trailing space.
  query_instruction: "Represent this sentence for searching relevant passages: "

  # When mode == "local":
  # local_model: "BAAI/bge-m3"   # HF model name, auto-downloads on first use

  # When the configured endpoint is unreachable, fall back to a deterministic
  # hash-based pseudo-embedding (1024-d). Same text → same vector, so retrieval
  # is stable across runs, but vectors carry no semantic signal. Offline/dev
  # only — not a replacement for a real model.
  # hash_fallback: false

# ── Formatter Settings ───────────────────────────────────────────────
formatter:
  chunk_threshold_chars: 28000   # texts above this trigger chunked processing (~7000 tokens)
  chunk_max_tokens: 16384        # max output tokens per chunk LLM call
  chunk_timeout: 300             # seconds for each chunk LLM call

# ── Pipeline Settings ────────────────────────────────────────────────
pipeline:
  format_timeout: 3600           # seconds for full pipeline formatting (async)

# ── Logging Settings ─────────────────────────────────────────────────
logging:
  max_bytes: 5242880             # 5 MB rotating log file size
  debug_log_llm_responses: false # when true, saves raw LLM responses to tmp/raw/ for debugging
